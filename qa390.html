<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA 390x844</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b;overflow:hidden}
  #wrap{position:fixed;left:0;top:0;width:390px;height:844px;background:#fff;overflow:hidden}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="./index.html?qa=1"></iframe></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var tab = q.get("tab") || "games";
  var y = Number(q.get("y") || 0);
  var open = q.get("open");           /* 상세 섹션 이름 (예: sectHalli) */
  var f = document.getElementById("f");
  f.addEventListener("load", function(){
    try{
      var d = f.contentDocument, w = f.contentWindow;
      var b = d.querySelector('[data-tab="' + tab + '"]');
      if(b) b.click();
      if(open){ var o = d.getElementById(open); if(o) o.setAttribute("open",""); }
      setTimeout(function(){ w.scrollTo(0, y); }, 250);
    }catch(e){}
  });
})();
</script>
</body>
</html>
